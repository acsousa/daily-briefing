[project]
name = "daily-briefing"
version = "0.1.0"
description = "Personalized two-host daily audio briefing rendered to Spotify"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "httpx>=0.27",
    "edge-tts>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
brief = "briefing.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["briefing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
