# Personal interests & style. Copy to profile.yaml (gitignored) and make it yours.
# Feeds ranking (topic weights + keywords) and scripting (style + host personas).
# The loader prefers profile.yaml and falls back to this generic example.

owner:
  name: Your Name
  location: { city: "", state: "", timezone: America/New_York }

# weight 0-1 steers ranking; keywords help match articles to topics
interests:
  - { topic: technology, weight: 1.0, keywords: [AI, software, hardware] }
  - { topic: business,   weight: 0.8, keywords: [markets, economy, earnings] }
  - { topic: world,      weight: 0.6, keywords: [] }
  - { topic: science,    weight: 0.4, keywords: [space, research] }

must_cover: []                       # topics to always include if anything qualifies
avoid: []                            # topics/keywords to de-prioritize or skip
limits: { max_world_headlines: 2, max_segments: 8 }

style:
  inspirations: []                   # podcasts/shows whose tone you like
  tone: "Smart, concise, conversational. Substance over hype."
  reading_level: informed general
  banned: [clickbait, filler]
  hosts:
    ARIA:   { role: anchor,  voice: en-US-AriaNeural }
    ANDREW: { role: analyst, voice: en-US-AndrewNeural }

episode:
  open_with: weather
  segment_order: [weather, top_story, world, science_kicker]
