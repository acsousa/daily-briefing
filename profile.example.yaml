# Personal interests & style. Copy to profile.yaml (gitignored) and make it yours.
# Feeds ranking (topic weights + keywords) and scripting (tone). Easiest path is the
# config page (`brief config`); this file is the source of truth it reads and writes.
# With no profile.yaml, this generic example is used.
#
# `topic` values use the shared taxonomy that sources are tagged with:
#   technology defense robotics business science health world politics sports
#   entertainment local
# Ingestion keeps an article if its source topics intersect your active topics
# (weight > 0) OR an interest keyword appears in it, and drops anything matching `avoid`.

owner:
  name: Your Name
  location: { city: "", state: "", timezone: America/New_York }

# Each interest: a topic, its ranking weight (0–1, higher = more prominent), and
# optional keywords that boost matching stories and keep them through ingestion.
interests:
  - { topic: technology, weight: 1.0, keywords: [AI, software, hardware] }
  - { topic: business,   weight: 0.8, keywords: [markets, economy, earnings] }
  - { topic: science,    weight: 0.6, keywords: [space, research] }
  - { topic: world,      weight: 0.6, keywords: [] }
  - { topic: health,     weight: 0.4, keywords: [] }

regions: [U.S.]                      # geographic focus (boosts ranking): U.S./Europe/Canada/South America/Asia
must_cover: []                       # topics to always include if anything qualifies
avoid: []                            # topics/keywords to drop outright
limits: { max_segments: 8 }          # cap on body segments per episode

style:
  # The scriptwriter + editor read this sentence. The config page's tone slider
  # rewrites it from a preset; edit here directly for a fully custom voice.
  tone: "Smart, concise, conversational. Substance over hype, with a light human touch."
